<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>up2k Upload Example</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        .upload-zone { border: 2px dashed #ccc; padding: 50px; text-align: center; margin: 20px 0; }
        .upload-zone.dragover { background: #f0f0f0; border-color: #333; }
        .progress-bar { width: 100%; height: 30px; background: #f0f0f0; border-radius: 5px; overflow: hidden; margin: 10px 0; }
        .progress-fill { height: 100%; background: #4CAF50; transition: width 0.3s; }
        .file-item { padding: 10px; margin: 5px 0; background: #f9f9f9; border-radius: 3px; }
        .controls { margin: 20px 0; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .status { margin: 10px 0; }
    </style>
</head>
<body>
    <h1>up2k Resumable Upload Example</h1>

    <div class="upload-zone" id="dropZone">
        <p>Drop files here or click to select</p>
        <input type="file" id="fileInput" multiple style="display: none;">
    </div>

    <div class="controls">
        <label>Parallel uploads: <input type="number" id="parallelUploads" value="6" min="1" max="50"></label>
        <button id="uploadBtn">Upload Selected Files</button>
        <button id="pauseBtn">Pause</button>
    </div>

    <div id="fileList"></div>

    <script src="uploader.js"></script>
</body>
</html>
